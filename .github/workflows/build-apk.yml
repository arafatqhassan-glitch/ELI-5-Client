name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract source.zip if Present
        run: |
          if [ -f "source.zip" ]; then
            echo "Found source.zip, extracting..."
            unzip -q source.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup System Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install NDK, CMake, and Accept Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platform-tools"

      - name: Locate Project and Build Universal APK
        run: |
          # Locate build.gradle directory
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "settings.gradle" | head -n 1)
          
          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: Could not locate build.gradle even after extracting source.zip."
            exit 1
          fi

          BUILD_DIR=$(dirname "$GRADLE_FILE")
          echo "Found project directory at: $BUILD_DIR"
          cd "$BUILD_DIR"

          # Generate wrapper and assemble debug APK
          gradle wrapper
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ELI-5-Client-Universal-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
