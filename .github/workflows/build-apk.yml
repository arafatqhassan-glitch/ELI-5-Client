name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup System Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: '' # CRITICAL: Disables loading the deprecated 'tools' package
          accept-android-sdk-licenses: true

      - name: Install NDK, CMake, and Extract Source
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platform-tools"
          if [ -f "source.zip" ]; then
            unzip -q source.zip
          fi

      - name: Build Universal Debug APK
        run: |
          BUILD_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          cd "$BUILD_DIR"
          gradle wrapper
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ELI-5-Client-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
