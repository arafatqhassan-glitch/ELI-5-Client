name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext build-essential cmake ninja-build

      - name: Unzip Source Files (If present)
        run: |
          if [ -f "source.zip" ]; then
            unzip -o source.zip
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Universal Debug APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found!"
            exit 1
          fi
          BUILD_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in: $BUILD_DIR"
          cd "$BUILD_DIR"
          
          # Force AndroidX properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          chmod +x gradlew
          # Build assembleDebug without ABI splitting flags to output a single universal APK
          ./gradlew assembleDebug -Pandroid.startParameter.buildTargetAbi=none --no-daemon

      - name: Rename and Prepare Output File
        run: |
          APK_PATH=$(find . -name "*-debug.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          fi
          
          if [ -n "$APK_PATH" ]; then
            echo "Found compiled APK at: $APK_PATH"
            mkdir -p release_output
            cp "$APK_PATH" "release_output/ELI-5-Client Debug.apk"
          else
            echo "Error: No APK file was generated by the build!"
            exit 1
          fi

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELI-5-Client Debug
          path: "release_output/ELI-5-Client Debug.apk"
          
