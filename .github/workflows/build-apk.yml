name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup System Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install NDK, CMake, and Accept Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platform-tools"

      - name: Generate Wrapper and Build Universal APK (32-bit & 64-bit)
        run: |
          # Find the folder containing build.gradle or settings.gradle
          BUILD_DIR=$(dirname $(find . -name "build.gradle" -o -name "settings.gradle" | head -n 1))
          echo "Building in directory: $BUILD_DIR"
          cd "$BUILD_DIR"
          
          # Generate the missing gradlew wrapper script and run assembleDebug
          gradle wrapper
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ELI-5-Client-Universal-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
